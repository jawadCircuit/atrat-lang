[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atrat-lang"
version = "0.8.12"
description = "Atrat: a compiled language with ownership, HM types, C speed and inline assembly"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Atrat contributors" }]
keywords = ["programming-language", "compiler", "systems", "ownership", "hindley-milner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jawadCircuit/atrat-lang"
Source = "https://github.com/jawadCircuit/atrat-lang"
Issues = "https://github.com/jawadCircuit/atrat-lang/issues"
Changelog = "https://github.com/jawadCircuit/atrat-lang/blob/main/CHANGELOG.md"

[project.scripts]
atrc = "atrat.driver:main"

[tool.setuptools]
packages = ["atrat"]

[tool.setuptools.package-data]
atrat = ["prelude.atr"]
